<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#070e0a">
<meta name="robots" content="noindex,nofollow">
<title>AUMARA — between houses.</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/elcidspain/aumara-sandbox@main/flight.css">
</head>
<body>
  <div id="world">
    <div id="stage">
      <video id="flight"
        src="https://raw.githubusercontent.com/elcidspain/aumara-sandbox/main/media/flight_v2.mp4"
        poster="https://raw.githubusercontent.com/elcidspain/aumara-sandbox/main/media/flight_v2_poster.jpg"
        playsinline muted preload="auto" disablepictureinpicture></video>
    </div>
    <div id="veil" aria-hidden="true"></div>
    <div class="topmark" aria-hidden="true">
      <span class="wordmark">AUMARA</span>
      <span class="place-quiet">Benidoleig</span>
    </div>
    <p id="hint" class="hint" hidden></p>
    <div id="place" class="place" hidden>
      <span class="place-name">AUMARA</span>
      <span class="place-sub">Benidoleig</span>
    </div>
    <div id="chrome" class="chrome">
      <button type="button" id="btnLeft" class="pill ghost" aria-label="Look left">←</button>
      <button type="button" id="btnGyro" class="pill soft" hidden>Enable look</button>
      <button type="button" id="btnLookHint" class="pill soft" hidden>Drag look</button>
      <button type="button" id="btnForward" class="pill primary" disabled>Fly</button>
      <button type="button" id="btnRight" class="pill ghost" aria-label="Look right">→</button>
    </div>
    <div id="tap" class="tap-start" role="button" tabindex="0" aria-label="Tap to start">
      <div class="tap-dot" aria-hidden="true"></div>
    </div>
  </div>
  <script src="https://cdn.jsdelivr.net/gh/elcidspain/aumara-sandbox@main/flight.js" defer></script>
</body>
</html>
